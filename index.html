<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Minesweeper</title>
</head>

<body>
    <main class="game">
        <h1>Сапёр</h1>

        <section class="settings">
            <label for="difficulty">Сложность</label>
            <select id="difficulty">
                <option value="easy">Лёгкая</option>
                <option value="medium" selected>Средняя</option>
                <option value="hard">Сложная</option>
                <option value="custom">Своя настройка</option>
            </select>

            <div class="setting-fields">
                <label>
                    Строки
                    <input id="rowsInput" type="number" min="4" max="30" value="8">
                </label>

                <label>
                    Столбцы
                    <input id="columnsInput" type="number" min="4" max="30" value="10">
                </label>

                <label>
                    Мины
                    <input id="minesInput" type="number" min="1" max="79" value="10">
                </label>
            </div>

            <button id="startButton">Новая игра</button>
        </section>

        <div class="game-info">
            <p id="counter">Мин осталось: 10</p>
            <p id="status">Удачи!</p>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
